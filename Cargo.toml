[package]
name = "ndeploy"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.54.1", features = ["macros", "rt", "process", "io-util", "time"] }


[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
